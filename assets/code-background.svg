<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Código sobre fundo escuro">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111722"/></linearGradient></defs>
<rect width="1200" height="260" rx="12" fill="url(#bg)"/>
<g font-family="Consolas,monospace" font-size="17" fill="#606a79" opacity=".5"><text x="28" y="48">01</text><text x="28" y="80">02</text><text x="28" y="112">03</text><text x="28" y="144">04</text><text x="28" y="176">05</text><text x="28" y="208">06</text><text x="28" y="240">07</text></g>
<g font-family="Consolas,monospace" font-size="19" opacity=".85">
<text x="85" y="48" fill="#a990d3">public sealed class <tspan fill="#7ba1b9">ProjectService</tspan></text>
<text x="85" y="80" fill="#677587">{</text>
<text x="120" y="112" fill="#a990d3">public async Task <tspan fill="#b5c6d7">ExecuteAsync</tspan>()</text>
<text x="120" y="144" fill="#677587">{</text>
<text x="155" y="176" fill="#a990d3">var <tspan fill="#b5c6d7">result = </tspan>await <tspan fill="#7ba1b9">repository</tspan><tspan fill="#b5c6d7">.LoadAsync();</tspan></text>
<text x="155" y="208" fill="#b5c6d7">await <tspan fill="#7ba1b9">pipeline</tspan>.RunAsync(result);</text>
<text x="120" y="240" fill="#677587">} }</text>
</g>
<g font-family="Consolas,monospace" font-size="16" opacity=".36">
<text x="770" y="70" fill="#a990d3">const <tspan fill="#9eb6cc">tasks = projects.map(</tspan></text>
<text x="805" y="102" fill="#9eb6cc">project =&gt; project.build()</text>
<text x="770" y="134" fill="#9eb6cc">);</text>
<text x="770" y="182" fill="#a990d3">await <tspan fill="#9eb6cc">Promise.all(tasks);</tspan></text>
<text x="770" y="214" fill="#7ba18a">return result;</text>
</g></svg>
